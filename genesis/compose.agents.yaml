# Genesis agents: Arthur, Mira, Felix and Nova in one container.
#
#   docker network create genesis        (once; see the end of this file)
#   docker compose -f genesis/compose.agents.yaml up -d --build
#
# The world bootstrap runs from this image too, inside the Docker network, where RCON is:
#   docker compose -f genesis/compose.agents.yaml run --rm -e GENESIS_RCON_PASSWORD \
#       -e GENESIS_RCON_HOST=minecraft agents node genesis/world/bootstrap.js
# (GENESIS_RCON_PASSWORD is taken from the shell that runs the command and is not kept anywhere.)
#
# Settings live in genesis/settings.json and the profiles in genesis/profiles/.
# Both are mounted read-only, so editing them needs a restart, not a rebuild.
# The launcher (genesis/start.js) refuses to start while a profile still holds
# a placeholder for the model name or the Ollama address.
#
# Model-written code is off: the launcher forces it off and ignores the
# environment switch upstream offers. Keep the command below as it is.

services:
  agents:
    build:
      context: ..
      dockerfile: genesis/Dockerfile
    image: genesis-agents
    command: ["node", "genesis/start.js"]
    init: true
    environment:
      # Saved memory loads on start. For a full reset start, run once with
      #   GENESIS_LOAD_MEMORY=false docker compose -f genesis/compose.agents.yaml up -d
      GENESIS_LOAD_MEMORY: "${GENESIS_LOAD_MEMORY:-true}"
    volumes:
      - ./settings.json:/app/genesis/settings.json:ro
      - ./profiles:/app/genesis/profiles:ro
      # agent memory, histories and logs (same folder the upstream compose file mounts);
      # the Genesis checkpoints go there too (bots/genesis_checkpoints)
      - ../bots:/app/bots
      # The Genesis decision loop ("genesis_planning" in settings.json) needs the world config:
      # the seed, the camp, the field, the plots, each agent's home and range, and the rules.
      # Copy genesis.world.example.json to genesis.world.json, fill it in for the world that is
      # running, then remove the "#" below. (While the file does not exist, leave the line
      # commented out: Docker would create a folder in its place.)
      # It also needs a bootstrapped world: run  node genesis/world/bootstrap.js  once against
      # the Minecraft server. Its manifest lands in bots/genesis_world (mounted above), and the
      # launcher refuses to switch planning on without it.
      # - ./genesis.world.json:/app/genesis/genesis.world.json:ro
    # The MindServer (port 8081) listens on every interface inside this container
    # ("mindserver_host": "0.0.0.0" in settings.json), so a container attached to the
    # same Docker network reaches it by service name:  http://agents:8081
    # That network is the named network "genesis" (decided), which the dashboard stack
    # (genesis/compose.dashboard.yaml) and the Minecraft server (genesis/compose.minecraft.yaml)
    # join as well. Inside it the agents reach Redis at redis://redis:6379, Postgres at
    # postgres:5432 and the Minecraft server at minecraft:25600 (RCON: minecraft:25575).
    # The port is NOT published to the host, on purpose: the MindServer has no login
    # and can create, stop and reconfigure agents. Do not add a "ports:" entry here.
    networks:
      - genesis

# Made once, by hand, before the first "up" of any Genesis compose file:
#   docker network create genesis
# No compose file owns it, so the three stacks can be started and stopped in any order.
networks:
  genesis:
    name: genesis
    external: true
